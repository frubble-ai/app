name: PR Template

# The title must pass commitlint, since it becomes the squash commit
# message, and the body must fill every section of the template.
# `edited` is in the trigger so fixing either re-runs the check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Quality — PR Template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-monorepo

      # The same rules the commit-msg hook and `Quality — Commit Messages`
      # apply, so a title they would reject as the squash commit fails here.
      - name: Lint the title with commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint --verbose

      # No action does this: the ones that exist only check that a body is
      # non-empty or contains a string. Bots never fill a template, so only
      # their title is checked. The body arrives through env, never
      # interpolated into the script.
      - name: Check every section of the template is filled
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os, re, sys

          template = open(".github/pull_request_template.md", encoding="utf-8").read()
          strip = lambda s: re.sub(r"<!--.*?-->", "", s, flags=re.S)
          body = strip(os.environ.get("PR_BODY") or "")

          parts = re.split(r"^(## .+)$", body, flags=re.M)
          sections = {parts[i].strip(): parts[i + 1].strip() for i in range(1, len(parts), 2)}

          problems = []
          for heading in re.findall(r"^## .+$", template, flags=re.M):
              if heading not in sections:
                  problems.append(f"section missing: {heading}")
              elif not sections[heading]:
                  problems.append(f"section empty: {heading}")

          # The template ships its checklist unticked, so a body copied as-is would
          # pass the emptiness check. Every item must be ticked or marked n/a.
          for heading in [h for h in sections if "checklist" in h.lower()]:
              for line in sections[heading].splitlines():
                  if re.match(r"\s*- \[ \]", line) and not re.search(r"\b(n/a|not applicable)\b", line, re.I):
                      problems.append(f"checklist item not ticked or marked n/a: {line.strip()}")

          for p in problems:
              print(f"::error::{p}")
          if problems:
              print("Fill every section of .github/pull_request_template.md, then edit the pull request.")
              sys.exit(1)
          print("The pull request follows the template.")
