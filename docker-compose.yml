# Local dependencies: Postgres and the Pub/Sub emulator.
# bin/local-create.sh starts them and creates the topic and subscription.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-frubble}
      POSTGRES_USER: ${DB_USER:-frubble}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frubble_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-frubble} -d ${DB_NAME:-frubble}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The emulator pushes to the worker on the host (bin/local-create.sh creates the subscription).
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=frubble-local
    ports:
      - "127.0.0.1:8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
