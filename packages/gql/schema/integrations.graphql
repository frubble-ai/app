"The outside tools an organization can connect."
enum IntegrationProvider {
	GITHUB
	LINEAR
	SLACK
}

"A provider the organization has connected."
type Integration {
	provider: IntegrationProvider!
	connectedAt: DateTime!
}

type StartIntegrationConnectPayload {
	"Send the browser here; it comes back to the app's home with the outcome."
	redirectUrl: String!
}

type DisconnectIntegrationPayload {
	disconnected: Boolean!
}

input IntegrationTarget {
	organizationId: String!
	provider: IntegrationProvider!
}

extend type Query {
	"The providers one of the caller's organizations has connected."
	integrations(organizationId: String!): [Integration!]!
}

extend type Mutation {
	"Begin connecting a provider (owners and admins only)."
	startIntegrationConnect(
		input: IntegrationTarget!
	): StartIntegrationConnectPayload!

	"Disconnect a provider (owners and admins only); its tokens are revoked."
	disconnectIntegration(
		input: IntegrationTarget!
	): DisconnectIntegrationPayload!
}
