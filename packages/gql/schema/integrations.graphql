"The outside tools an organization can connect."
enum IntegrationProvider {
	GITHUB
	LINEAR
	SLACK
}

"A provider the organization has connected."
type Integration {
	provider: IntegrationProvider!
	connectedAt: DateTime!
}

"A GitHub organization the connected user belongs to."
type GithubOrganization {
	id: String!
	login: String!
	description: String
	avatarUrl: String!
}

"A Linear team the connected user can see."
type LinearTeam {
	id: String!
	name: String!
}

"A Slack channel the connected user can see."
type SlackChannel {
	id: String!
	name: String!
	isPrivate: Boolean!
	memberCount: Int
}

type StartIntegrationConnectPayload {
	"Send the browser here; it comes back to the app's home with the outcome."
	redirectUrl: String!
}

type DisconnectIntegrationPayload {
	disconnected: Boolean!
}

input IntegrationTarget {
	organizationId: String!
	provider: IntegrationProvider!
}

extend type Query {
	"The providers one of the caller's organizations has connected."
	integrations(organizationId: String!): [Integration!]!

	"""
	The organizations the connected GitHub user belongs to. `NOT_FOUND` when
	GitHub is not connected.
	"""
	githubOrganizations(organizationId: String!): [GithubOrganization!]!

	"The Linear teams the connected user can see. `NOT_FOUND` when not connected."
	linearTeams(organizationId: String!): [LinearTeam!]!

	"""
	The Slack channels the connected user can see, archived ones left out.
	`NOT_FOUND` when Slack is not connected.
	"""
	slackChannels(organizationId: String!): [SlackChannel!]!
}

extend type Mutation {
	"Begin connecting a provider (owners and admins only)."
	startIntegrationConnect(
		input: IntegrationTarget!
	): StartIntegrationConnectPayload!

	"Disconnect a provider (owners and admins only); its tokens are revoked."
	disconnectIntegration(
		input: IntegrationTarget!
	): DisconnectIntegrationPayload!
}
